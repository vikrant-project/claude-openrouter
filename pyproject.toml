[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-openrouter"
version = "1.0.0"
description = "Claude Code + OpenRouter Free Tier: 16+ Free LLMs with Instant Auto-Failover"
authors = [{ name = "Vikrant Rana", email = "vikrant@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "litellm>=1.100.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0"
]

[project.scripts]
claude-openrouter = "src.cli:main"
