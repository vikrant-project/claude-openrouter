<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" fill="url(#bgG)" rx="14"/>
  <rect width="896" height="356" x="2" y="2" fill="none" stroke="#1e293b" rx="13"/>
  
  <text x="40" y="45" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Auto-Failover Decision Lifecycle</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">How incoming Claude commands seamlessly navigate rate limits without manual intervention</text>

  <!-- Step 1 -->
  <rect x="40" y="110" width="170" height="180" rx="8" fill="url(#stepGrad)" stroke="#38bdf8"/>
  <circle cx="70" cy="140" r="14" fill="#0284c7"/>
  <text x="66" y="145" font-family="system-ui" font-weight="700" font-size="12" fill="#fff">1</text>
  <text x="95" y="145" font-family="system-ui" font-weight="700" font-size="14" fill="#f8fafc">User Query</text>
  <text x="55" y="180" font-family="monospace" font-size="11" fill="#38bdf8">claude "fix bug"</text>
  <text x="55" y="210" font-family="system-ui" font-size="11" fill="#94a3b8">Claude Code sends</text>
  <text x="55" y="228" font-family="system-ui" font-size="11" fill="#94a3b8">Anthropic payload</text>
  <text x="55" y="246" font-family="system-ui" font-size="11" fill="#94a3b8">to local port 4141.</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 210 200 L 260 200" stroke="#64748b" stroke-width="2"/>
  <polygon points="258,196 266,200 258,204" fill="#64748b"/>

  <!-- Step 2 -->
  <rect x="260" y="110" width="180" height="180" rx="8" fill="url(#stepGrad)" stroke="#a855f7"/>
  <circle cx="290" cy="140" r="14" fill="#9333ea"/>
  <text x="286" y="145" font-family="system-ui" font-weight="700" font-size="12" fill="#fff">2</text>
  <text x="315" y="145" font-family="system-ui" font-weight="700" font-size="14" fill="#f8fafc">Primary Model</text>
  <text x="275" y="180" font-family="system-ui" font-size="11" fill="#94a3b8">Queries top model</text>
  <text x="275" y="198" font-family="monospace" font-size="10" fill="#a855f7">openrouter/free</text>
  <text x="275" y="230" font-family="system-ui" font-size="11" fill="#22c55e">✔ Success? Return SSE</text>
  <text x="275" y="250" font-family="system-ui" font-size="11" fill="#f43f5e">✖ 429 RateLimit Hit?</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 440 200 L 490 200" stroke="#f43f5e" stroke-width="2"/>
  <polygon points="488,196 496,200 488,204" fill="#f43f5e"/>

  <!-- Step 3 -->
  <rect x="490" y="110" width="180" height="180" rx="8" fill="url(#stepGrad)" stroke="#f59e0b"/>
  <circle cx="520" cy="140" r="14" fill="#d97706"/>
  <text x="516" y="145" font-family="system-ui" font-weight="700" font-size="12" fill="#fff">3</text>
  <text x="545" y="145" font-family="system-ui" font-weight="700" font-size="14" fill="#f8fafc">Auto-Cooldown</text>
  <text x="505" y="180" font-family="system-ui" font-size="11" fill="#94a3b8">Model 1 marked in</text>
  <text x="505" y="198" font-family="system-ui" font-size="11" fill="#f59e0b">60s cooldown.</text>
  <text x="505" y="225" font-family="system-ui" font-size="11" fill="#94a3b8">Instant failover jumps</text>
  <text x="505" y="243" font-family="system-ui" font-size="11" fill="#94a3b8">to Model 2 (e.g. Cohere)</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 670 200 L 720 200" stroke="#10b981" stroke-width="2"/>
  <polygon points="718,196 726,200 718,204" fill="#10b981"/>

  <!-- Step 4 -->
  <rect x="720" y="110" width="150" height="180" rx="8" fill="url(#stepGrad)" stroke="#10b981"/>
  <circle cx="750" cy="140" r="14" fill="#059669"/>
  <text x="746" y="145" font-family="system-ui" font-weight="700" font-size="12" fill="#fff">4</text>
  <text x="775" y="145" font-family="system-ui" font-weight="700" font-size="14" fill="#f8fafc">Delivery</text>
  <text x="735" y="180" font-family="system-ui" font-size="11" fill="#34d399">Stream SSE chunks</text>
  <text x="735" y="200" font-family="system-ui" font-size="11" fill="#94a3b8">Tool use blocks</text>
  <text x="735" y="220" font-family="system-ui" font-size="11" fill="#94a3b8">Zero CLI crash!</text>
  <text x="735" y="245" font-family="system-ui" font-size="11" fill="#22c55e">✔ Endless Uptime</text>
</svg>