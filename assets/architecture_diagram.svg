<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" fill="url(#bgGrad)" rx="16"/>
  <rect width="996" height="576" x="2" y="2" fill="none" stroke="#1e293b" stroke-width="1.5" rx="15"/>

  <!-- Title Section -->
  <text x="50" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Claude Code + OpenRouter Architecture</text>
  <text x="50" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Zero-downtime resilient AI routing across 16+ free models with Anthropic protocol translation</text>

  <!-- Left: Claude Code CLI Client -->
  <rect x="50" y="120" width="220" height="400" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="65" y="135" width="40" height="40" rx="8" fill="#0284c7" opacity="0.2"/>
  <circle cx="85" cy="155" r="10" fill="#38bdf8"/>
  <text x="115" y="150" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Claude CLI</text>
  <text x="115" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">Ubuntu WSL / Linux</text>
  
  <rect x="65" y="200" width="190" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="75" y="222" font-family="monospace" font-size="12" fill="#38bdf8">$ claude</text>
  <text x="75" y="240" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Starts CLI session</text>

  <rect x="65" y="265" width="190" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="75" y="285" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Anthropic Protocol</text>
  <text x="75" y="305" font-family="monospace" font-size="10" fill="#a5b4fc">POST /v1/messages</text>
  <text x="75" y="323" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• Tool use schema</text>
  <text x="75" y="341" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">• SSE stream iterator</text>

  <rect x="65" y="370" width="190" height="130" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="75" y="392" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Supported Features</text>
  <text x="75" y="415" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">✔ File Reading/Writing</text>
  <text x="75" y="435" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">✔ Terminal Execution</text>
  <text x="75" y="455" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">✔ Multi-turn Planning</text>
  <text x="75" y="475" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">✔ Autocompact Memory</text>

  <!-- Middle: Local FastAPI + LiteLLM Bridge -->
  <rect x="360" y="120" width="280" height="400" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="375" y="135" width="40" height="40" rx="8" fill="#a855f7" opacity="0.2"/>
  <text x="390" y="160" font-family="monospace" font-size="20" font-weight="700" fill="#c084fc">⚡</text>
  <text x="425" y="150" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Auto-Failover Bridge</text>
  <text x="425" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#c084fc">127.0.0.1:4141 | FastAPI + LiteLLM</text>

  <!-- Connectors Left -> Middle -->
  <path d="M 270 290 L 360 290" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="358,286 366,290 358,294" fill="#38bdf8"/>
  <path d="M 360 320 L 270 320" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="272,316 264,320 272,324" fill="#a855f7"/>

  <rect x="375" y="200" width="250" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="385" y="222" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">1. Protocol Transformer</text>
  <text x="385" y="242" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Converts Anthropic tools &amp; messages</text>
  <text x="385" y="260" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">into OpenAI chat completion specs</text>

  <rect x="375" y="290" width="250" height="110" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
  <text x="385" y="312" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">2. Smart Dynamic Failover</text>
  <text x="385" y="332" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Tries top priority free model</text>
  <text x="385" y="352" font-family="system-ui, sans-serif" font-size="11" fill="#f43f5e">• Catches 429 RateLimit / Outages</text>
  <text x="385" y="372" font-family="system-ui, sans-serif" font-size="11" fill="#22c55e">• Jumps to next candidate (60s cooldown)</text>
  <text x="385" y="390" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">• Infinite resilient execution loop</text>

  <rect x="375" y="415" width="250" height="85" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="385" y="437" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">3. SSE Event Formatter</text>
  <text x="385" y="457" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Streams message_start, content deltas,</text>
  <text x="385" y="475" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">and tool_use blocks back to Claude</text>

  <!-- Right: OpenRouter Free Models Pool -->
  <rect x="730" y="120" width="220" height="400" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="745" y="135" width="40" height="40" rx="8" fill="#10b981" opacity="0.2"/>
  <text x="760" y="160" font-family="system-ui" font-size="20" font-weight="700" fill="#34d399">☁</text>
  <text x="795" y="150" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">OpenRouter</text>
  <text x="795" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">16+ Free Tier Pool</text>

  <!-- Connectors Middle -> Right -->
  <path d="M 640 310 L 730 310" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="728,306 736,310 728,314" fill="#10b981"/>

  <rect x="745" y="195" width="190" height="310" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="755" y="215" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">ACTIVE FREE POOL</text>
  
  <text x="755" y="235" font-family="monospace" font-size="10" fill="#f8fafc">1. openrouter/free</text>
  <text x="755" y="250" font-family="system-ui" font-size="9" fill="#64748b">Dynamic Auto Meta-Router</text>
  
  <text x="755" y="270" font-family="monospace" font-size="10" fill="#f8fafc">2. cohere/north-mini-code</text>
  <text x="755" y="285" font-family="system-ui" font-size="9" fill="#64748b">Code specialist (256k ctx)</text>
  
  <text x="755" y="305" font-family="monospace" font-size="10" fill="#f8fafc">3. nvidia/nemotron-3.5</text>
  <text x="755" y="320" font-family="system-ui" font-size="9" fill="#64748b">1M Context Reasoning</text>

  <text x="755" y="340" font-family="monospace" font-size="10" fill="#f8fafc">4. poolside/laguna-s</text>
  <text x="755" y="355" font-family="system-ui" font-size="9" fill="#64748b">SWE &amp; Coding Engine</text>

  <text x="755" y="375" font-family="monospace" font-size="10" fill="#f8fafc">5. poolside/laguna-xs</text>
  <text x="755" y="390" font-family="system-ui" font-size="9" fill="#64748b">Ultra-fast code generation</text>

  <text x="755" y="410" font-family="monospace" font-size="10" fill="#f8fafc">6. dots-studio/dots-3</text>
  <text x="755" y="425" font-family="system-ui" font-size="9" fill="#64748b">512k Context with Tools</text>

  <text x="755" y="445" font-family="monospace" font-size="10" fill="#f8fafc">7. google/gemma-4-31b</text>
  <text x="755" y="460" font-family="system-ui" font-size="9" fill="#64748b">Instruction model</text>

  <text x="755" y="480" font-family="system-ui" font-size="10" fill="#38bdf8">+ 9 More Models in Pool</text>
</svg>